# Copy to deploy/cloudrun/api.env.yaml (ignored by Git) and fill in every value.
# Used by:  gcloud run deploy nyaberaworks-api --env-vars-file deploy/cloudrun/api.env.yaml
# Values are YAML strings: keep the double quotes.
APP_ENV: "production"
APP_DEBUG: "false"
ENABLE_API_DOCS: "false"
SITE_URL: "https://nyaberaworks.co.ke"
LOG_LEVEL: "INFO"
WEB_CONCURRENCY: "1"
# Neon POOLED connection string, in this form (note the +psycopg and sslmode):
# postgresql+psycopg://USER:PASSWORD@ep-xxxx-pooler.REGION.aws.neon.tech/neondb?sslmode=require
DATABASE_URL: "CHANGE_ME"
# 64 hex characters. Generate with the command in docs/12-go-live-cloud-run.md.
APP_SECRET_KEY: "CHANGE_ME"
# 64 hex characters, a DIFFERENT value. Must be identical in web.env.yaml.
PROXY_SHARED_SECRET: "CHANGE_ME"
# Leave as console until you add a mail provider; then see the guide (section 12).
EMAIL_BACKEND: "console"
