# Copy to deploy/cloudrun/web.env.yaml (ignored by Git) and fill in.
# Used by:  gcloud run deploy nyaberaworks-web --env-vars-file deploy/cloudrun/web.env.yaml
# NEXT_PUBLIC_SITE_URL is not here: it is fixed at build time (see the Dockerfile).
# The address of the API service (printed when you deploy it), no trailing slash.
API_INTERNAL_URL: "https://CHANGE_ME.europe-west1.run.app"
# Exactly the same value as PROXY_SHARED_SECRET in api.env.yaml.
PROXY_SHARED_SECRET: "CHANGE_ME"
# How many addresses from the right of X-Forwarded-For is the real visitor.
# 1 is the expected value on Cloud Run; the guide shows how to verify it.
CLIENT_IP_HOPS_FROM_RIGHT: "1"
