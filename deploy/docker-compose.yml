# NyaberaWorks production stack: Caddy (HTTPS) -> Next.js website + FastAPI API -> PostgreSQL.
# Run from this folder:  docker compose --env-file .env up -d --build
# Only Caddy publishes ports (80 and 443). The database and API are not reachable from the internet.

name: nyaberaworks

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nyaberaworks
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: nyaberaworks
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nyaberaworks -d nyaberaworks"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  # Runs once on every deploy: applies database migrations, loads starter services
  # and projects that are missing (never overwrites your edits), then exits.
  migrate:
    build: ../backend
    restart: "no"
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://nyaberaworks:${POSTGRES_PASSWORD}@db:5432/nyaberaworks
    command: ["sh", "-c", "python -m alembic upgrade head && python -m app.cli.seed_catalog"]
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  api:
    build: ../backend
    restart: unless-stopped
    env_file: [.env]
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      ENABLE_API_DOCS: "false"
      CORS_ALLOWED_ORIGINS: ""
      FORWARDED_ALLOW_IPS: "*"
      SITE_URL: https://${DOMAIN}
      DATABASE_URL: postgresql+psycopg://nyaberaworks:${POSTGRES_PASSWORD}@db:5432/nyaberaworks
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [internal]

  web:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_SITE_URL: https://${DOMAIN}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api
    networks: [internal]

networks:
  internal:

volumes:
  pgdata:
  caddy_data:
  caddy_config:
