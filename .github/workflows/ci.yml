name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nyaberaworks
          POSTGRES_PASSWORD: ci_password_only
          POSTGRES_DB: nyaberaworks_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nyaberaworks -d nyaberaworks_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg://nyaberaworks:ci_password_only@localhost:5432/nyaberaworks_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://example.com

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build the production images (not pushed)
        run: |
          docker build -t nyaberaworks-api backend
          docker build -t nyaberaworks-web --build-arg NEXT_PUBLIC_SITE_URL=https://example.com frontend
      - name: Check the Compose file
        working-directory: deploy
        run: |
          printf 'DOMAIN=example.com\nPOSTGRES_PASSWORD=ci\nAPP_SECRET_KEY=%s\n' "$(head -c 32 /dev/zero | tr '\0' a)" > .env
          docker compose --env-file .env config --quiet
